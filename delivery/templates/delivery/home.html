
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akshay Food Delivery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
            color: #333;
        }

        header {
            background: #e94b25;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 15px;
        }

        .foods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .food-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #ddd;
        }

        .food-card h2 {
            color: #e94b25;
        }

        .price {
            font-weight: bold;
            font-size: 20px;
        }

        .empty {
            text-align: center;
            padding: 30px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Akshay Food Delivery</h1>
        <p>Fresh food delivered to your door!</p>
    </header>

    <main class="container">
        <h2>Our Food Menu</h2>
        
<p>
    <a href="{% url 'view_cart' %}">
        🛒 View Cart ({{ cart_count }})
    </a>
</p>


        <div class="foods">
            {% for food in foods %}
                <div class="food-card">
                    <h2>{{ food.name }}</h2>
                    <p>{{ food.description }}</p>
                    <p class="price">

<form method="post" action="{% url 'add_to_cart' food.id %}">
    {% csrf_token %}
    <button type="submit">Add to Cart</button>
</form>

</p>
                </div>
            {% empty %}
                <div class="empty">
                    <p>No food items available yet.</p>
                    <p>Add food items through the admin panel.</p>
                </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
